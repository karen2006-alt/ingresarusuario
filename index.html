<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso al Sistema de Gestión ITPM">
  <title>Acceso | Sistema de Gestión ITPM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">IT</div>

      <div class="heading">
        <p class="eyebrow">DPW-207 · Aula virtual</p>
        <h1 id="login-title">Sistema de Gestión</h1>
        <p class="subtitle">Programación robusta con TypeScript</p>
      </div>

      <div class="course-line">
        <span class="course-dot"></span>
        <span>Instituto Tecnológico Puerto Montt</span>
      </div>

      <form class="login-form" action="#" method="post">
        <div class="field-group">
          <label for="username">Usuario docente</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
            </svg>
            <input id="username" name="username" type="text" placeholder="Ej. felix.maldonado" autocomplete="username" required autofocus>
          </div>
        </div>

        <div class="field-group">
          <div class="label-row">
            <label for="password">Contraseña</label>
            <a href="#">¿La olvidaste?</a>
          </div>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"></path>
            </svg>
            <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
          </div>
        </div>

        <label class="remember-me">
          <input type="checkbox" name="remember">
          <span class="checkmark"></span>
          Mantener la sesión iniciada
        </label>

        <button type="submit">
          <span>Ingresar al sistema</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </button>
      </form>

      <p class="support">Acceso exclusivo para docentes <span>·</span> <a href="#">Soporte</a></p>
    </section>
  </main>
</body>
</html>
